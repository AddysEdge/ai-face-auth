name: Bug report
description: Something in the pipeline, CLI, demo, or native scaffold behaves incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Not for security vulnerabilities.** Report those privately - see
        [SECURITY.md](https://github.com/AddysEdge/ai-face-auth/blob/main/SECURITY.md).

        **Never attach face images, video, embeddings, or templates.** Describe
        the input instead: dimensions, dtype, lighting, how it was produced.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no biometric data, no passwords, no keys, and no personal data belonging to anyone else.
          required: true
        - label: This is not a security vulnerability. (If it is, close this and use the private advisory channel.)
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Enrollment
        - Authentication
        - Liveness / anti-spoofing
        - Camera / capture
        - Template storage
        - Rate limiting
        - Logging
        - CLI
        - Demo window
        - Evaluation tool
        - Native IPC scaffold (native/)
        - Build / CI / tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem. Include the exact command.
      placeholder: |
        1. .venv\Scripts\faceauth.exe enroll --user-id alice
        2. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        Console output or a stack trace. Redact anything identifying.
        Do not paste log files wholesale.
      render: text

  - type: input
    id: commit
    attributes:
      label: Commit SHA
      placeholder: "1aa2cdc"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Windows: 11 24H2
        Python: 3.12.x
        Camera: (model, RGB or IR)
        MSVC/CMake (if native):
    validations:
      required: true
