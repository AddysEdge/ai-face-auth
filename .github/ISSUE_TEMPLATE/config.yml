blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/AddysEdge/ai-face-auth/security/advisories/new
    about: >-
      Never report a vulnerability in a public issue, and never attach
      biometric data. Open a private draft advisory instead - see SECURITY.md.
  - name: Read the Phase 2 security review first
    url: https://github.com/AddysEdge/ai-face-auth/blob/main/docs/PHASE2_SECURITY_REVIEW.md
    about: >-
      Asking about Windows sign-in integration? The review explains why the
      local-account case is a NO-GO and what the supported scope actually is.
  - name: Contributing guide
    url: https://github.com/AddysEdge/ai-face-auth/blob/main/CONTRIBUTING.md
    about: >-
      Setup, build and test commands, security boundaries, prohibited changes,
      and what a pull request needs.
