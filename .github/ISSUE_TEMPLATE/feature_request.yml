name: Feature request
description: Propose a change or addition.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please read
        [CONTRIBUTING.md](https://github.com/AddysEdge/ai-face-auth/blob/main/CONTRIBUTING.md)
        and the ["What this project will never do"](https://github.com/AddysEdge/ai-face-auth/blob/main/SECURITY.md#what-this-project-will-never-do)
        section of SECURITY.md first. Some proposals are permanently out of
        scope, and it saves everyone time to know that up front.

  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary check
      description: >-
        These are non-negotiable. A proposal that requires any of them cannot
        be accepted, however useful it would be.
      options:
        - label: This does not require handling a Windows password in any form.
          required: true
        - label: This does not require registering a Credential Provider, installing a service, or changing Windows authentication, LSA, LogonUI, Credential Guard, Windows Hello, or account settings.
          required: true
        - label: This does not require undocumented NGC or Windows Hello internals.
          required: true
        - label: This does not require committing biometric data, model weights, keys, certificates, or build output.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem, not the solution you already have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: >-
        Required. Does it touch liveness, template storage, rate limiting,
        logging, the fail-closed paths, or the IPC contract? Does it widen who
        can read biometric data? "None, because..." is a fine answer.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: >-
        Any claim about Windows behaviour needs a link to current official
        Microsoft documentation. Any claim about accuracy or spoof resistance
        needs measurements. Blog posts and "it seems to work" are not evidence.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
