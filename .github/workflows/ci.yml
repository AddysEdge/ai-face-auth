name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing here needs write access to the repository, and a
# pull_request workflow must never be able to mutate it. No secrets are used or
# referenced by any job, so a fork PR cannot exfiltrate anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12 (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project with its declared dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # B17 is a property of the dependency set, so prove the telemetry-bearing
      # runtime is not installed here BEFORE anything else runs. The
      # oracle-equivalence job below deliberately installs mediapipe; that is a
      # different environment and is not evidence about network silence. If the
      # two ever converge, this step fails rather than letting a mediapipe-
      # bearing environment produce a network-silence result.
      - name: Assert mediapipe is absent from the shipping environment
        shell: python
        run: |
          import importlib.util as util, pathlib, sys, tomllib

          assert util.find_spec("mediapipe") is None, (
              "mediapipe is installed in the shipping/network-test environment; "
              "B17 evidence from this job would be meaningless"
          )
          assert util.find_spec("ai_edge_litert") is not None, "ai-edge-litert is required"

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          declared = data["project"]["dependencies"] + data["project"]["optional-dependencies"]["dev"]
          offenders = [d for d in declared if d.lower().startswith("mediapipe")]
          assert not offenders, f"mediapipe is a declared dependency: {offenders}"

          roots = [pathlib.Path("src"), pathlib.Path("scripts")]
          bad = []
          for root in roots:
              for path in root.rglob("*.py"):
                  # compare.py loads the oracle on purpose and is not shipped.
                  if path.as_posix().endswith("scripts/b17_option_a/compare.py"):
                      continue
                  for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                      stripped = line.strip()
                      if stripped.startswith(("import mediapipe", "from mediapipe")):
                          bad.append(f"{path}:{number}")
          assert not bad, f"runtime import of mediapipe: {bad}"
          print("mediapipe absent: not installed, not declared, not imported")

      # Model weights are not committed (see .gitignore and
      # src/faceauth/model_registry.py), so they are fetched from their pinned,
      # checksum-verified sources. This runs before pytest deliberately: the
      # realmodel-marked tests - including the end-to-end network-silence check
      # that blocker B17 turns on - skip themselves when the weights are
      # absent, and a skipped test is not evidence. It is also the only reason
      # this job touches the network; the check further down observes just the
      # child process it spawns, so this download cannot pollute its result.
      - name: Fetch the pinned model weights
        run: python scripts/fetch_models.py

      # The DPAPI tests still skip when pywin32 is unavailable. That is not
      # silently ignored - it reports as skipped in the run summary.
      - name: Run pytest
        run: python -m pytest -q --junitxml=pytest-results.xml

      # Python-level socket patching cannot see a connection opened from native
      # code - it never enters CPython's socket module - so this asks Windows
      # instead. With the weights present it runs FULL mode: imports plus a
      # real liveness session including teardown, which is where the removed
      # MediaPipe runtime used to upload. The allowlist is empty, so any
      # external destination at all fails the build.
      # See docs/PRIVACY_NETWORK_AUDIT.md section 4 and docs/adr/0005.
      - name: Check outbound network destinations against the allowlist
        run: python scripts/check_network_activity.py --json

      # A pass in the wrong mode is not the evidence B17 needs, so assert the
      # mode explicitly rather than trusting the exit code alone.
      - name: Assert the network check actually ran in FULL mode
        shell: python
        run: |
          import json, subprocess, sys
          out = subprocess.run(
              [sys.executable, "scripts/check_network_activity.py", "--json"],
              capture_output=True, text=True, timeout=500,
          )
          payload, _ = json.JSONDecoder().raw_decode(out.stdout[out.stdout.index("{"):])
          assert out.returncode == 0, out.stdout + out.stderr
          assert payload["mode"] == "full", f"ran in {payload['mode']} mode, not full"
          assert payload["observer"]["canary_seen"] is True, "observer health not proven"
          assert payload["observer"]["failed_polls"] == [], payload["observer"]
          assert payload["command_deadline_expired"] is False
          assert payload["external"] == [], payload["external"]
          print("FULL mode, observer healthy, zero external endpoints.")

      - name: Run Ruff
        run: python -m ruff check --no-cache src tests scripts

      - name: Run mypy
        run: python -m mypy --no-incremental src

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn

  native:
    name: Native x64 ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # windows-latest ships MSVC and CMake. This workflow installs no Visual
      # Studio components and no system-wide dependencies.
      - name: Report toolchain
        shell: pwsh
        run: cmake --version

      - name: Configure (x64)
        run: cmake -S native -B native/build -A x64

      - name: Build ${{ matrix.config }}
        run: cmake --build native/build --config ${{ matrix.config }}

      - name: Test ${{ matrix.config }}
        run: ctest --test-dir native/build -C ${{ matrix.config }} --output-on-failure

      # The CollectingSink race (issue #7) surfaced as a segfault in the
      # aggregate in-process runner that appeared once and then passed on
      # re-run. A single green run would not have caught it, so Debug repeats
      # the aggregate runner and the concurrency tests a bounded number of
      # times. Debug only, because the crash was Debug-specific and layout
      # sensitive; ~15 iterations of a ~2s runner costs well under a minute.
      # Bounded on purpose - never an until-fail loop.
      - name: Repeat aggregate and concurrency tests (Debug only)
        if: matrix.config == 'Debug'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i = 1; $i -le 15; $i++) {
            Write-Host "--- iteration $i/15 ---"
            ctest --test-dir native/build -C Debug --output-on-failure `
              -R 'protocol\.all_registered_tests|collecting_sink|concurrent_writers|snapshot_taken_while_writers|share_one_collecting_sink'
            if ($LASTEXITCODE -ne 0) { throw "repeat iteration $i failed" }
          }
          Write-Host "15/15 iterations passed."

  # Belt-and-braces on top of .gitignore: an ignore rule protects against
  # accident, this protects against a deliberate `git add -f`.
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject committed binaries, secrets, biometric data, and model weights
        shell: bash
        run: |
          set -euo pipefail
          patterns='\.(exe|dll|obj|lib|pdb|ilk|onnx|task|tflite|pt|pth|safetensors|pem|key|pfx|p12|cer|crt|der|reg|npy|log|dpapi)$'
          if git ls-files | grep -Ei "$patterns"; then
            echo "::error::A file matching a prohibited pattern is tracked in git."
            exit 1
          fi
          if git ls-files | grep -E '^(data|logs)/'; then
            echo "::error::Runtime data or logs are tracked in git."
            exit 1
          fi
          echo "Repository hygiene check passed."

      # Filenames are a weak guard: `git add -f notes.txt` defeats any .gitignore
      # pattern. This checks tracked CONTENT for the combination that identifies
      # a B18 manifest or analysis artifact - participant id, session id, and a
      # blink-score series together. The allowlist is the schema that defines
      # those names and the source/tests that legitimately mention them; a data
      # file has no reason to appear anywhere else.
      #
      # No exception is added for a future aggregate report: publishing one
      # requires owner decision D16, which is undecided.
      - name: Reject tracked B18 participant data, evidence, and artifacts
        run: |
          python scripts/check_b18_data_leak.py --self-test
          python scripts/check_b18_data_leak.py

      - name: Reject Credential Provider registration or credential serialization in code
        shell: bash
        run: |
          set -euo pipefail
          # Phase 2 must not register a Credential Provider, install a service,
          # or serialize a Windows credential. These are the concrete API and
          # registry markers that would show someone crossed that line.
          # Documentation is excluded because the ADRs quote these names on
          # purpose; so is this workflow, which necessarily contains them.
          markers='DllRegisterServer|ICredentialProviderCredential|CredentialProviderFilters|CreateServiceW|CreateServiceA|Security Packages|KERB_INTERACTIVE_LOGON|KERB_CERTIFICATE_LOGON|CryptProtectData.*LOCAL_MACHINE'
          if git grep -nEI "$markers" -- ':!docs/**' ':!*.md' ':!.github/workflows/**'; then
            echo "::error::Found a registration or credential-serialization marker outside documentation."
            exit 1
          fi
          echo "No registration or credential-serialization markers in code."

  # THIS JOB NEITHER RUNS NOR BLOCKS TODAY. Two separate things are false, and
  # conflating them would be misleading:
  #
  #   1. It does not RUN. The action needs the repository's Dependency graph
  #      feature (Settings -> Code security), which is OFF, so it reports
  #      "not supported on this repository" instead of reviewing anything.
  #   2. It could not BLOCK even if it ran, because of the
  #      `continue-on-error: true` below.
  #
  # Enabling Dependency graph alone would fix (1) but NOT (2) - making this
  # enforcing also means deliberately removing `continue-on-error`, in a PR
  # that says so. Enabling the setting is a repository security change and is
  # the owner's decision, not something to do silently from CI.
  #
  # Until both happen, `pip-audit` below is the dependency scanning that
  # actually runs and actually blocks. Do not read a green tick on this job as
  # "dependencies were reviewed" - the step below prints a warning annotation
  # whenever the review did not run.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Report whether the review actually ran
        shell: bash
        run: |
          if [ "${{ steps.review.outcome }}" = "success" ]; then
            echo "Dependency review ran and found nothing at or above 'high'."
          else
            echo "::warning::Dependency review did NOT run. Enable Dependency graph at" \
                 "https://github.com/${{ github.repository }}/settings/security_analysis" \
                 "to make it run; removing continue-on-error in ci.yml is a separate" \
                 "change needed to make it block. pip-audit covers dependency" \
                 "scanning meanwhile."
          fi

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Extract the platform-independent dependency set
        shell: bash
        run: |
          python - <<'PY' > audit-requirements.txt
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              data = tomllib.load(handle)

          for spec in data["project"]["dependencies"]:
              # Windows-only extras cannot be resolved on this runner.
              if "sys_platform" in spec:
                  continue
              print(spec.split(";")[0].strip())
          for spec in data["project"]["optional-dependencies"]["dev"]:
              print(spec.split(";")[0].strip())
          PY
          cat audit-requirements.txt

      # ENFORCING. `continue-on-error` was removed: an advisory job that
      # nobody reads is not a security control, and a green tick that ignores a
      # known CVE is worse than no job at all.
      #
      # Severity policy: fail on ANY known vulnerability affecting a declared
      # dependency. Every dependency here is exactly pinned, so a finding is
      # always actionable - bump the pin, or record an explicit, justified
      # `--ignore-vuln` exception in this file with a comment saying why.
      # There are no ignored advisories today.
      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit --progress-spinner off -r audit-requirements.txt

  # ---------------------------------------------------------------------------
  # Oracle equivalence.
  #
  # This job installs `mediapipe==1.0.1` ON PURPOSE, as the reference oracle to
  # compare against. That makes this environment the OPPOSITE of the shipping
  # one: it is NOT network-silent, and it is not evidence about B17. The
  # network-silence evidence comes from the `python` job above, where mediapipe
  # is absent from the dependency set entirely. The two must never be merged.
  #
  # What this job is for: proving the LiteRT reimplementation still agrees with
  # the runtime it replaced, to the tolerances declared in
  # scripts/b17_option_a/compare.py. Those tolerances are enforced by the
  # command's exit status, so a regression fails the build rather than being
  # printed and ignored.
  oracle-equivalence:
    name: Oracle equivalence (mediapipe oracle - NOT the shipping environment)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project with its normal pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Installed only here, only as the oracle. Pinned to the exact version
      # whose behaviour this reimplementation was measured against.
      - name: Install the mediapipe oracle
        run: python -m pip install "mediapipe==1.0.1"

      - name: Confirm both runtimes are present in THIS job only
        shell: python
        run: |
          import importlib.util as util
          for name in ("mediapipe", "ai_edge_litert"):
              assert util.find_spec(name), f"{name} is required for the oracle comparison"
          print("oracle environment ready: mediapipe + ai-edge-litert")

      # The comparison refuses to run without the pinned bundle rather than
      # skipping, and fetch_models.py verifies each file's SHA-256 against
      # src/faceauth/model_registry.py before accepting it.
      - name: Fetch and SHA-verify the pinned model bundle
        run: python scripts/fetch_models.py

      - name: Run the enforcing oracle comparison
        run: >
          python -m scripts.b17_option_a.compare
          --out oracle-equivalence-results.json

      # The command's exit status already enforces the tolerances. This asserts
      # the run was complete as well as passing: a comparison that measured
      # fewer cases than the corpus defines would otherwise pass quietly.
      - name: Assert every expected case and metric was measured
        shell: python
        run: |
          import json, sys
          sys.path.insert(0, ".")
          from scripts.b17_option_a.compare import REQUIRED_FACE_METRICS, TOLERANCES
          from scripts.b17_option_a.corpus import build_corpus

          report = json.load(open("oracle-equivalence-results.json", encoding="utf-8"))
          expected = [name for name, _ in build_corpus()]

          assert report["passed"] is True, report["failures"]
          assert report["failures"] == [], report["failures"]
          assert report["expected_cases"] == expected, "corpus drifted from the report"
          assert report["cases"] == len(expected), report["cases"]
          assert report["detection_agreement"] == report["cases"]
          assert report["presence_agreement"] == report["presence_relevant_cases"]
          assert report["tolerances"] == TOLERANCES, "tolerances differ from the module"

          measured = [r for r in report["results"]
                      if r["oracle_detected"] and r["replica_detected"]]
          assert measured, "no case produced a face; the comparison measured nothing"
          for row in measured:
              for metric in REQUIRED_FACE_METRICS:
                  assert metric in row, f"{row['case']} is missing {metric}"

          gate = [r for r in report["results"] if r["case"] == "presence_gate_reject"]
          assert gate, "the presence-gate case is missing from the corpus"
          assert gate[0]["replica_detector_fired"] is True, "gate case no longer detector-positive"
          assert gate[0]["replica_detected"] is False, "the presence gate stopped rejecting"
          assert gate[0]["oracle_detected"] is False, "the oracle no longer rejects the gate case"

          print(f"{len(measured)} measured cases, {report['cases']} total, all tolerances enforced")

      - name: Upload the comparison result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-equivalence-results
          path: oracle-equivalence-results.json
          if-no-files-found: error
